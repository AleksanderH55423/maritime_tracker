<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Maritime Tracker</title>
<script src="https://unpkg.com/globe.gl"></script>
<style>
  html, body { margin: 0; height: 100%; background: #060b10; overflow: hidden; }
  #globe-container { position: fixed; inset: 0; }
  #status {
    position: fixed;
    top: 12px;
    left: 12px;
    color: #9fb2c0;
    font-family: monospace;
    font-size: 12px;
    background: rgba(14,22,32,0.8);
    padding: 6px 10px;
    border-radius: 3px;
  }
</style>
</head>
<body>

<div id="status">loading globe&hellip;</div>
<div id="globe-container"></div>

<script>
  const statusEl = document.getElementById('status');

  try {
    const globe = Globe()(document.getElementById('globe-container'))
      .backgroundColor('#060b10')
      .globeImageUrl('https://unpkg.com/three-globe/example/img/earth-dark.jpg')
      .bumpImageUrl('https://unpkg.com/three-globe/example/img/earth-topology.png')
      .pointOfView({ lat: 51.5, lng: 2, altitude: 2 }, 0);

    globe.controls().autoRotate = true;
    globe.controls().autoRotateSpeed = 0.3;

    function resize() {
      globe.width(window.innerWidth);
      globe.height(window.innerHeight);
    }
    window.addEventListener('resize', resize);
    resize();

    globe
      .pointLat(d => d.lat)
      .pointLng(d => d.lon)
      .pointColor(() => '#35c7c2')
      .pointRadius(0.35)
      .pointAltitude(0.005)
      .pointLabel(d => `${d.name || 'Unnamed vessel'} (${d.mmsi})`);

    statusEl.textContent = 'globe loaded, connecting to live feed…';

    // Step 2: instead of one static fetch, keep a running Map of every
    // vessel (keyed by MMSI) and update it from the /live WebSocket.
    // The server already batches its pushes once a second, so we just
    // re-render the globe's points whenever a batch arrives.
    const vesselsByMmsi = new Map();
    let renderScheduled = false;

    function scheduleRender() {
      // Collapse multiple updates arriving close together into one redraw.
      if (renderScheduled) return;
      renderScheduled = true;
      requestAnimationFrame(() => {
        globe.pointsData(Array.from(vesselsByMmsi.values()));
        statusEl.textContent = `${vesselsByMmsi.size} vessels tracked`;
        renderScheduled = false;
      });
    }

    function connect() {
      const wsUrl = (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/live';
      const ws = new WebSocket(wsUrl);

      ws.onopen = () => {
        statusEl.style.color = '#9fb2c0';
      };

      ws.onmessage = (ev) => {
        const msg = JSON.parse(ev.data);
        if (msg.type === 'snapshot' || msg.type === 'update') {
          for (const v of msg.vessels) vesselsByMmsi.set(v.mmsi, v);
          scheduleRender();
        } else if (msg.type === 'remove') {
          for (const mmsi of msg.mmsis) vesselsByMmsi.delete(mmsi);
          scheduleRender();
        }
      };

      ws.onerror = () => ws.close();

      ws.onclose = () => {
        statusEl.textContent = `${vesselsByMmsi.size} vessels tracked (reconnecting…)`;
        statusEl.style.color = '#e2a23b';
        setTimeout(connect, 2000);
      };
    }
    connect();
  } catch (err) {
    statusEl.textContent = 'globe failed to load: ' + err.message;
    statusEl.style.color = '#e35b5b';
    console.error(err);
  }
</script>
</body>
</html>
